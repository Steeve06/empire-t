# Install once: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=800]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/api/

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        files: ^apps/api/

  - repo: local
    hooks:
      - id: mypy-api
        name: mypy (api)
        entry: bash -c 'cd apps/api && mypy .'
        language: system
        pass_filenames: false
        files: ^apps/api/.*\.py$
      - id: web-lint
        name: eslint + prettier + tsc (web, api-client)
        entry: bash -c 'pnpm -r lint && pnpm -r typecheck'
        language: system
        pass_filenames: false
        files: ^(apps/web|packages)/.*\.(ts|tsx|css|json|html)$
      - id: api-contract
        name: TypeScript types match openapi.yaml
        entry: pnpm --filter @empire-t/api-client check-generated
        language: system
        pass_filenames: false
        files: ^packages/api-client/(openapi\.yaml|src/schema\.d\.ts)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]
