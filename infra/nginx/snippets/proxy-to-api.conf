# Forwarding to gunicorn. Django trusts X-Forwarded-Proto (SECURE_PROXY_SSL_HEADER)
# and one proxy hop for client IPs (NUM_PROXIES=1, used by rate limiting).
proxy_pass http://api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# nginx is the single source of security headers (snippets/security-headers*.conf);
# hide Django's copies so responses never carry two different values.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Cross-Origin-Opener-Policy;
